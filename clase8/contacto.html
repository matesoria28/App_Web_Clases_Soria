<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellitas - contactos</title>
     <link rel="stylesheet" href="recursos/estilos/index.css">
</head>

<body>
    
    <header>
        <a href="./index.html">
            <img src="./recursos/imagenes/huella.png" alt="logo de huella">
        </a>
        <nav>
            <a href="./index.html">
                Inicio
            </a>
            <a href="./catalogo.html">
                catalogo
            </a>
            <a href="./contacto.html">
                Contacto
            </a>
        </nav>

    </header>
    <main>
        <h1>Contacto</h1>
        <h2>Escribinos</h2>
        <form action="./contacto.html" method="post">
            <!--
            nombre
            telefono
            tamaño
            edad
            comentario / sobre la mascota
            -->
            <label for="id-nombre">nombre</label>
            <input type="text" name="nombre" id="id-nombre">

            <label for="id-telefono">telefono</label>
            <input type="tel" name="telefono" id="id-telefono">

            <label for="id-tamaño-mascota">tamaño mascota</label>
            <select name="tamaño-mascota" id="id-tamaño-mascota">
                <option value="C">chico</option>
                <option value="M">mediano</option>
                <option value="G">grande</option>
            </select>

            <label for="id-edad">edad</label>
            <input type="number" name="edad" min="0" max="100" id="id-edad">

            <label for="id-comentario">comentario sobre la mascota</label>
            <textarea name="comentario" id="id-comentario"></textarea>

            <!--
            <input type="submit" value="Enviar">-->
            <button type="submit">
                Enviar
            </button>

            <button type="reset">
                Limpiar
            </button>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3404.7899732760397!2d-64.19147712386778!3d-31.41991219642275!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9432a286a09424ab%3A0x637dd38a25e5eb11!2sBlvd.%20San%20Juan%20200%2C%20X5022%20C%C3%B3rdoba!5e0!3m2!1ses-419!2sar!4v1788354726309!5m2!1ses-419!2sar" width="650" height="400" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <h2>Donde estamos</h2>
        </form>
    </main>
    <footer>
        <ul>
            <li>
                <a href="https://instagram.com/@huellitas">
                    @Huellitas
                </a>
            </li>
            <li>
                Bv. San Juan 200 - Bº Nueva Cordoba
            </li>
        </ul>


    </footer>
</body>

</html>
