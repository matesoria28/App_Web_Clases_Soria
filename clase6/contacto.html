<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellitas</title>
</head>

<body>
    <header>
        <a href="./index.html">
            <img src="./recursos/imagenes/huella.png" alt="logo de huella">
        </a>
        <nav>
            <a href="./index.html">
                Inicio
            </a>
            <a href="./contacto.html">
                Contacto
            </a>
        </nav>

    </header>
    <main>
        <h1>Contacto</h1>
        <form action="./contacto.html" method="post">
            <!--
            nombre
            telefono
            tamaño
            edad
            comentario / sobre la mascota
            -->
            <label for="id-nombre">nombre</label>
            <input type="text" name="nombre" id="id-nombre">

            <label for="id-telefono">telefono</label>
            <input type="tel" name="telefono" id="id-telefono">

            <label for="id-tamaño-mascota">tamaño mascota</label>
            <select name="tamaño-mascota" id="id-tamaño-mascota">
                <option value="C">chico</option>
                <option value="M">mediano</option>
                <option value="G">grande</option>
            </select>

            <label for="id-edad">edad</label>
            <input type="number" name="edad" min="0" max="100" id="id-edad">

            <label for="id-comentario">comentario sobre la mascota</label>
            <textarea name="comentario" id="id-comentario"></textarea>

            <!--
            <input type="submit" value="Enviar">-->
            <button type="submit">
                Enviar
            </button>

            <button type="reset">
                Limpiar
            </button>
        </form>
    </main>
    <footer>
        <ul>
            <li>
                <a href="https://instagram.com/@huellitas">
                    @Huellitas
                </a>
            </li>
            <li>
                Bv. San Juan 200 - Bº Nueva Cordoba
            </li>
        </ul>


    </footer>
</body>

</html>
